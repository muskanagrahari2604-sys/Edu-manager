# ===================================================================
# Student Assignment & Exam Manager - Spring Boot Configuration
# ===================================================================

server.port=8080
spring.application.name=student-assignment-exam-manager

# -------------------------------------------------------------------
# MySQL Database Configuration
# Update username/password to match your local MySQL installation
# -------------------------------------------------------------------
spring.datasource.url=jdbc:mysql://localhost:3306/student_manager_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=password
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# -------------------------------------------------------------------
# JPA & Hibernate Settings
# -------------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# -------------------------------------------------------------------
# SQL Initialization (Optional fallback)
# -------------------------------------------------------------------
spring.sql.init.mode=never

# -------------------------------------------------------------------
# Logging
# -------------------------------------------------------------------
logging.level.com.student.manager=INFO
logging.level.org.springframework.web=INFO
logging.level.org.springframework.security=WARN
